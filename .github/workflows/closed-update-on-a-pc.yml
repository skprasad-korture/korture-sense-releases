# Session 141, 2 November 2026: does a Windows copy update itself while the app
# is closed, and stay closed? The source is built here with an older version
# number, installed and never opened. Only the minute task runs.
name: closed update on a pc
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit of korture-ai-human to build
        default: main
      older:
        description: The version number this test build says it is
        default: "0.1.113"
permissions:
  contents: write
jobs:
  pc:
    runs-on: windows-latest
    timeout-minutes: 50
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          repository: skprasad-korture/korture-ai-human
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.SOURCE_KEY }}
          path: src
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - uses: dtolnay/rust-toolchain@stable
      - name: Build with an older number, every line kept private
        env:
          GH_TOKEN: ${{ github.token }}
          OLDER: ${{ inputs.older }}
        run: |
          set +e
          log="$RUNNER_TEMP/build.log"
          sed -i -E "s/\"version\": \"[0-9.]+\"/\"version\": \"$OLDER\"/" src/app/src-tauri/tauri.conf.json
          sed -i -E "0,/^version = \"[0-9.]+\"/s//version = \"$OLDER\"/" src/app/src-tauri/Cargo.toml
          (cd src && npm ci && cd app && npx tauri build --bundles nsis) > "$log" 2>&1
          code=$?
          gh release create "closedupdate-${{ github.run_id }}" -R "${{ github.repository }}" --draft --title "closed update test, run ${{ github.run_id }}" --notes "build log" "$log" > /dev/null 2>&1
          echo "build exit $code"
          [ $code -eq 0 ]
      - name: Install it, never open it, run the minute task
        shell: pwsh
        run: |
          $exe = Get-ChildItem src/app/src-tauri/target/release/bundle/nsis -Filter *.exe | Select-Object -First 1
          Start-Process $exe.FullName -ArgumentList '/S' -Wait
          Remove-Item -Recurse -Force src
          $home2 = Join-Path $env:USERPROFILE '.korture'
          New-Item -ItemType Directory -Force $home2 | Out-Null
          [IO.File]::WriteAllText((Join-Path $home2 'config.json'), '{"pings":false}')
          $dir = Join-Path $env:LOCALAPPDATA 'Korture Sense'
          Get-Process | Where-Object { $_.Path -like "$dir*" } | Stop-Process -Force
          Start-Sleep -Seconds 3
          $prog = { Get-ChildItem $dir -Filter *.exe | Where-Object Name -notmatch 'uninstall' | Select-Object -First 1 }
          $v0 = (& $prog).VersionInfo.ProductVersion
          Write-Host "version on disk: $v0, running: $(@(Get-Process | Where-Object { $_.Path -like "$dir*" }).Count)"
          & (& $prog).FullName --agent "$env:SystemRoot\System32\cmd.exe" /c exit
          foreach ($i in 1..24) {
            Start-Sleep -Seconds 15
            $v = (& $prog).VersionInfo.ProductVersion
            if ($v -ne $v0) { break }
          }
          Start-Sleep -Seconds 60
          $u = Join-Path $home2 'update.log'
          Write-Host '== update.log'; if (Test-Path $u) { Get-Content $u | Write-Host }
          $v = (& $prog).VersionInfo.ProductVersion
          $running = @(Get-Process | Where-Object { $_.Path -like "$dir*" })
          Write-Host "version on disk now: $v, running: $($running.Count)"
          $running | ForEach-Object { Write-Host "running: $($_.Path) $($_.StartTime)" }
          if ($v -eq $v0) { Write-Host 'FAILED: a closed app did not update'; exit 1 }
          if ($running.Count -gt 0) { Write-Host 'FAILED: the update opened an app the person had closed'; exit 1 }
          Write-Host "PASSED: closed, updated to $v, still closed"
